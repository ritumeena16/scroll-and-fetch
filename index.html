<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scroll & Fetch</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            padding: 30px 20px;          
        }

        main {
            max-width: 700px;
            margin: auto;
        }

        header {
            text-align: center;
            padding: 35px 20px;
            background: #1e293b;
            border-radius: 15px;
            margin-bottom: 25px;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 12px;
            color: #38bdf8;
        }

        header p {
            color: #cbd5e1;
            line-height: 1.6;
        }

        #status {
            text-align: center;
            color: #facc15;
            margin: 20px 0;
        }

        #user-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 20px;
        }

        .card h2 {
            font-size: 18px;
            color: #7dd3fc;
            margin-bottom: 10px;
        }

        .card p {
            color: #cbd5e1;
            line-height: 1.5;
        }

        footer {
            text-align: center;
            padding: 35px 10px;
            margin-bottom: 500px;
            color: #94a3b8;
        }
        #loading{
            color: azure;
            text-align: center;
            margin-bottom: 20px;
        }
        #endData{
            color: azure;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <main>
        <header>
            <h1>Scroll & Fetch 🚀</h1>
            <p>Scroll down to load data and explore JavaScript throttling.</p>
        </header>

        <p id="status">Ready to start!</p>

        <p id="loading">Loading...</p>

        <section id="user-list">
      
        </section>

        <p id="endData">end-of-data message</p>
        <footer>
            Keep scrolling — more data will come soon!
        </footer>
    </main>
  <script src="script.js"></script>
</body>
</html>
